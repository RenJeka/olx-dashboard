# Dependabot (H6, docs/plans/h6-dependabot.md): PR з оновленнями залежностей приблизно раз на 2 тижні
# (1-го і 15-го числа о 07:00 за Києвом — рішення людини 2026-10-04; «кожні 2 тижні» Dependabot не вміє).
# npm: лише minor/patch, одним груповим PR; major не пропонуються (рішення людини 2026-10-04 — великі
# оновлення вирішуються вручну, P-012 у docs/parking.md). Дії CI — і major (як P-004: рантайм Node у GitHub).
# Кожен PR проходить CI; злиття в main = деплой на Render — лише з «так» людини (docs/rules.md → «Прод»).
version: 2
updates:
  # npm workspaces (server/ + web/) — один lock-файл у корені.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 7 1,15 * *"
      timezone: Europe/Kyiv
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # Версії дій у .github/workflows/ (P-004: щоб не відставати від Node-рантайму GitHub Actions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 7 1,15 * *"
      timezone: Europe/Kyiv
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
